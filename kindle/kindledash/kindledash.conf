# Kindle dashboard settings. loop.sh reads this file when it starts
# (run "Dashboard: Stop" and "Dashboard: Start" to apply a change).

PLACE="Ingelheim am Rhein"
LAT=49.9708
LON=8.0588
DASH_LANG=de                # en | de

# Calendars: put them in secrets.conf on the Kindle (not in this file, which is public on GitHub):
#   CALENDARS="https://calendar.google.com/calendar/ical/.../basic.ics"
# ICS URLs separated by spaces. Google Calendar: Settings > your calendar >
# "Secret address in iCal format". iCloud: share as "Public Calendar" (webcal:// works).
CALENDARS=""

# Updates over Wi-Fi: the Kindle checks this folder for a new MANIFEST (empty = no updates).
UPDATE_URL="https://raw.githubusercontent.com/biki/kindle-dashboard/main/kindle/kindledash"
UPDATE_EVERY=60             # minutes between checks (a power-button press always checks)

INTERVAL=60                 # minutes: refresh at every full multiple (60 = every full hour)
NIGHT_START=23              # local hour: no refreshes from here ...
NIGHT_END=6                 # ... until here (set both the same to refresh all night)
CAL_EVERY=60                # minutes between calendar downloads

WIFI_WAIT=60                # longest wait for Wi-Fi after it is turned on (seconds)
IDLE=30                     # seconds to stay awake after a power-button wake or start (for taps)
FL_LEVEL=12                 # front light level after a power-button press (1-24, 0 = never on).
                            # The light is off while the Kindle sleeps (that saves the battery).
SLEEP=1                     # 1 = suspend between refreshes, 0 = stay awake (more battery)
WIFI_OFF=1                  # 1 = Wi-Fi off between refreshes (saves battery)
TOUCH=""                    # touchscreen device, empty = detect it (see probe.txt)
